# =====================================================================
#  docker-compose.yml  —  levanta TODO el proyecto con un solo comando:
#
#       docker compose up --build
#
#  Son 3 "contenedores" (mini-computadoras aisladas):
#    db       -> Base de datos PostgreSQL + PostGIS   (puerto 5432)
#    backend  -> API en Python / FastAPI              (http://localhost:8000/docs)
#    frontend -> Página web en Next.js                (http://localhost:3000)
#    field-shift -> Interfaz React + Vite             (http://localhost:5173)
# =====================================================================
services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agridb
    ports:
      - "5432:5432"
    volumes:
      # Los datos de la BD se guardan aquí y sobreviven aunque apagues los contenedores.
      # Se borran SOLO si corres: docker compose down -v
      - postgres_data:/var/lib/postgresql/data
    # Le dice a Docker cómo saber si la BD ya está lista para recibir conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d agridb"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Tu carpeta ./backend se "refleja" dentro del contenedor:
      # si editas un .py, el servidor se recarga solo.
      - ./backend:/app
    depends_on:
      db:
        # Espera a que la BD esté lista (si no, el backend truena al crear las tablas)
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      # Tu carpeta ./frontend se refleja en el contenedor (cambios en vivo)...
      - ./frontend:/app
      # ...pero node_modules y .next se quedan DENTRO del contenedor
      # (así no necesitas instalar Node en tu compu).
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    environment:
      # Necesario en Windows para que detecte cambios en los archivos
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    tty: true
    stdin_open: true
    restart: unless-stopped

  # Interfaz "field-shift" (React + Vite) — http://localhost:5173
  # Independiente: usa datos de ejemplo, no depende del backend.
  field-shift:
    build:
      context: ./field-shift
    ports:
      - "5173:5173"
    volumes:
      - ./field-shift:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  postgres_data:
