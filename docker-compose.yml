# =====================================================================
#  docker-compose.yml — levanta TODO el proyecto con un solo comando:
#
#       docker compose up --build
#
#    db       -> PostgreSQL + PostGIS        (localhost:5432)
#    backend  -> API FastAPI                 (http://localhost:8000/docs)
#    frontend -> React + Vite (mapa y UI)    (http://localhost:3000)
#
#  Las variables tienen valores por defecto; para cambiarlas copia
#  .env.example como .env (Docker Compose lo lee solo).
# =====================================================================
services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-agridb}
    ports:
      - "5432:5432"
    volumes:
      # Los datos sobreviven aunque apagues los contenedores.
      # Se borran SOLO con: docker compose down -v
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-agridb}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://admin:password@db:5432/agridb}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NASA_POWER_BASE_URL: ${NASA_POWER_BASE_URL:-https://power.larc.nasa.gov/api}
      CLIMATE_CACHE_DAYS: ${CLIMATE_CACHE_DAYS:-30}
    volumes:
      # Si editas un .py, uvicorn se recarga solo.
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # true = datos de ejemplo (src/api/mock.ts). Pásalo a false cuando el backend implemente /api/v1/analyses.
      VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
      # Necesario en Windows para detectar cambios en los archivos
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules se queda DENTRO del contenedor (no necesitas Node en tu compu)
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
